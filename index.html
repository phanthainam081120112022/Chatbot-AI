<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat bot</title>
    <!-- link style -->
    <link rel="stylesheet" href="./style.css" />

    <!-- link icon-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <div id="header">
      <div class="icon"><i class="fas fa-comments"></i></div>
      <div class="name">
        <h4>Chatbot</h4>
      </div>
    </div>
    <!-- ===== HEADER ===== -->

    <!-- ===== MAIN ===== -->
    <div id="main">
      <div class="guest">
        Chào bạn, tôi là Chatbot AI, tôi có thể giúp gì được cho bạn?
      </div>
    </div>
    <!-- ===== MAIN ===== -->

    <div class="loading">
      <img src="./static/loading.svg" alt="" srcset="" />
    </div>

    <div id="footer">
      <div class="chat">
        <div class="input-text">
          <textarea
            class="textarea"
            name=""
            placeholder="Vui lòng nhập..."
          ></textarea>
        </div>

        <div class="enter">
          <button class="button">
            <i class="far fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- link javascript -->
    <script src="./script.js"></script>
  </body>
</html>
