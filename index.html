<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat bot</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="header">
      <div class="icon"><i class="fas fa-comments"></i></div>
      <div class="name">
        <h4>Chatbot</h4>
      </div>
    </div>

    <div id="main">
      <div class="guest">
        Chào bạn, tôi là Chatbot AI. Tôi có thể giúp gì được cho bạn?
      </div>
    </div>

    <div class="loading">
      <img src="./static/loading.svg" alt="Đang tải" />
    </div>

    <div id="footer">
      <div class="chat">
        <div class="input-text">
          <textarea
            class="textarea"
            placeholder="Vui lòng nhập hoặc bấm micro để nói..."
          ></textarea>
        </div>

        <div class="enter">
          <button class="voice-button" title="Nói với chatbot" type="button">
            <i class="fas fa-microphone"></i>
          </button>
          <button class="speak-button active" title="Bật/tắt đọc câu trả lời" type="button">
            <i class="fas fa-volume-high"></i>
          </button>
          <button class="button" type="button" title="Gửi">
            <i class="far fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

    <script src="./config.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
