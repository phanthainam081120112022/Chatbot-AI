name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Generate config.js
        env:
          API_GEMINI_KEY: ${{ secrets.API_GEMINI_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const key = process.env.API_GEMINI_KEY;

          if (!key) {
            throw new Error("Chưa cấu hình secret API_GEMINI_KEY");
          }

          fs.writeFileSync(
            "config.js",
            "window.APP_CONFIG = " +
              JSON.stringify({ API_GEMINI_KEY: key }) +
              ";\n"
          );
          NODE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
